name: Mew CloudStream Build

# Push and PR events for the same branch share one runner; newer revisions supersede stale checks.
concurrency:
  group: mew-cloudstream-${{ github.event.pull_request.head.ref || github.ref_name }}-${{ (github.event_name == 'workflow_dispatch' && inputs.build_apk == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-apk]')) }}-${{ github.event_name }}
  cancel-in-progress: true

on:
  push:
    branches:
      - enhanced
      - feature/cloudstream-dynamic-repositories
      - sync/upstream
  pull_request:
    branches:
      - enhanced
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build and upload the debug APK only for device testing or a manual build request'
        required: false
        type: boolean
        default: false

jobs:
  android-full-debug:
    # sync/upstream PRs run host tests once via pull_request; only an explicit [build-apk] push runs the APK pipeline.
    if: github.event_name != 'push' || github.ref_name != 'sync/upstream' || contains(github.event.head_commit.message, '[build-apk]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore stable Mew debug keystore
        if: (github.event_name == 'workflow_dispatch' && inputs.build_apk == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-apk]'))
        env:
          MEW_DEBUG_KEYSTORE_BASE64: ${{ secrets.MEW_DEBUG_KEYSTORE_BASE64 }}
          MEW_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.MEW_DEBUG_KEYSTORE_PASSWORD }}
          MEW_DEBUG_KEY_ALIAS: ${{ secrets.MEW_DEBUG_KEY_ALIAS }}
          MEW_DEBUG_KEY_PASSWORD: ${{ secrets.MEW_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$MEW_DEBUG_KEYSTORE_BASE64"
          test -n "$MEW_DEBUG_KEYSTORE_PASSWORD"
          test -n "$MEW_DEBUG_KEY_ALIAS"
          test -n "$MEW_DEBUG_KEY_PASSWORD"
          mkdir -p "$RUNNER_TEMP/mew-debug"
          printf '%s' "$MEW_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mew-debug/mew-debug.keystore"
          chmod 600 "$RUNNER_TEMP/mew-debug/mew-debug.keystore"

      - name: Prepare Gradle local properties
        run: touch local.properties

      - name: Verify Mew branding in localized resources
        run: |
          set -euo pipefail
          if git grep -n -E 'Discord|Ko-fi|Mew Enhanced|Nuvio Enhanced' -- 'composeApp/src/commonMain/composeResources/*/strings.xml'; then
            echo "Forbidden legacy branding remains in localized user-facing resources." >&2
            exit 1
          fi

      - name: Run Android host tests
        run: ./gradlew :composeApp:testAndroidHostTest -Pnuvio.android.distribution=full --stacktrace

      - name: Compile Android Kotlin sources without packaging an APK
        run: ./gradlew :composeApp:compileDebugKotlinAndroid -Pnuvio.android.distribution=full --stacktrace

      - name: Build Android Full debug
        if: (github.event_name == 'workflow_dispatch' && inputs.build_apk == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-apk]'))
        env:
          MEW_DEBUG_KEYSTORE_FILE: ${{ runner.temp }}/mew-debug/mew-debug.keystore
          MEW_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.MEW_DEBUG_KEYSTORE_PASSWORD }}
          MEW_DEBUG_KEY_ALIAS: ${{ secrets.MEW_DEBUG_KEY_ALIAS }}
          MEW_DEBUG_KEY_PASSWORD: ${{ secrets.MEW_DEBUG_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full --stacktrace

      - name: Verify Mew package ID
        if: (github.event_name == 'workflow_dispatch' && inputs.build_apk == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-apk]'))
        run: |
          set -euo pipefail
          APK="$(find androidApp/build/outputs/apk/full/debug -name '*.apk' -print -quit)"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -f "$APK"
          test -x "$APKANALYZER"
          APP_ID="$("$APKANALYZER" manifest application-id "$APK")"
          echo "APK application ID: $APP_ID"
          test "$APP_ID" = "com.mew.mobile.debug"

      - name: Verify debug APK signing
        if: (github.event_name == 'workflow_dispatch' && inputs.build_apk == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-apk]'))
        env:
          MEW_DEBUG_KEYSTORE_FILE: ${{ runner.temp }}/mew-debug/mew-debug.keystore
          MEW_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.MEW_DEBUG_KEYSTORE_PASSWORD }}
          MEW_DEBUG_KEY_ALIAS: ${{ secrets.MEW_DEBUG_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK="$(find androidApp/build/outputs/apk/full/debug -name '*.apk' -print -quit)"
          KEYSTORE_SHA="$(keytool -exportcert -rfc -keystore "$MEW_DEBUG_KEYSTORE_FILE" -storepass "$MEW_DEBUG_KEYSTORE_PASSWORD" -alias "$MEW_DEBUG_KEY_ALIAS" | openssl x509 -outform DER | sha256sum | awk '{print $1}' | tr '[:lower:]' '[:upper:]')"
          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          APKSIGNER_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK" 2>&1)"
          printf '%s\n' "$APKSIGNER_OUTPUT"
          APK_SHA="$(printf '%s\n' "$APKSIGNER_OUTPUT" | sed -n 's/.*SHA-256 digest: //p' | head -n1 | tr -d ':[:space:]' | tr '[:lower:]' '[:upper:]')"
          echo "Keystore certificate SHA-256: $KEYSTORE_SHA"
          echo "APK signer certificate SHA-256: $APK_SHA"
          test -n "$KEYSTORE_SHA"
          test -n "$APK_SHA"
          test "$KEYSTORE_SHA" = "$APK_SHA"
          echo "Debug APK certificate SHA-256: $APK_SHA"
      - name: Upload APK
        if: (github.event_name == 'workflow_dispatch' && inputs.build_apk == true) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[build-apk]'))
        uses: actions/upload-artifact@v4
        with:
          name: mew-cloudstream-full-debug
          path: androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 3
