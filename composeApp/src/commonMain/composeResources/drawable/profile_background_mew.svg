<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1015"/>
      <stop offset="52%" stop-color="#080B10"/>
      <stop offset="100%" stop-color="#0D0A12"/>
    </linearGradient>
    <radialGradient id="coolGlow" cx="18%" cy="16%" r="78%">
      <stop offset="0%" stop-color="#27C7D8" stop-opacity=".13"/>
      <stop offset="48%" stop-color="#168C9D" stop-opacity=".035"/>
      <stop offset="100%" stop-color="#168C9D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warmGlow" cx="88%" cy="88%" r="72%">
      <stop offset="0%" stop-color="#D85B91" stop-opacity=".10"/>
      <stop offset="52%" stop-color="#A63C70" stop-opacity=".025"/>
      <stop offset="100%" stop-color="#A63C70" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edgeShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020407" stop-opacity=".08"/>
      <stop offset="50%" stop-color="#020407" stop-opacity="0"/>
      <stop offset="100%" stop-color="#020407" stop-opacity=".22"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#base)"/>
  <rect width="1600" height="1000" fill="url(#coolGlow)"/>
  <rect width="1600" height="1000" fill="url(#warmGlow)"/>
  <rect width="1600" height="1000" fill="url(#edgeShade)"/>
